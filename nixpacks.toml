[variables]
# Mantemos isso para alinhar o sistema e evitar que ele baixe o Python 3.12 escondido
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
# Adicionamos as ferramentas base necessárias pelo Python e Nixpacks
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg", "gcc", "wget"]

[phases.install_chrome]
# Esta fase ocorre durante a Reconstrução, o que garante acesso permanente ao Chrome sem sumir nos reinícios!
cmds = [
    "apt-get update -y",
    "wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb",
    "apt-get install -y ./google-chrome-stable_current_amd64.deb",
    "rm -f google-chrome-stable_current_amd64.deb"
]

[phases.install]
dependsOn = ["setup", "install_chrome"]
# Instalamos as bibliotecas em seguida
cmds = ["python3 -m pip install --upgrade pip", "python3 -m pip install -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port 80"